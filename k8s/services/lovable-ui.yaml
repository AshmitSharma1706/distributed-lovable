# k8s/services/lovable-ui.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: lovable-ui
  namespace: lovable-core
  labels:
    app: lovable-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lovable-frontend
  template:
    metadata:
      labels:
        app: lovable-frontend
    spec:
      containers:
        - name: lovable-ui
          image: ashmitsharma317/lovable-ui:1.0.2
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: lovable-frontend
  namespace: lovable-core
  labels:
    app: lovable-frontend
spec:
  selector:
    app: lovable-frontend
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: lovable-ui
  namespace: lovable-core
  labels:
    app: lovable-frontend
spec:
  selector:
    app: lovable-frontend
  ports:
    - port: 80
      targetPort: 80
